name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clarinet:
    name: clarinet simnet · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
